<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"><title>Nothing Explorer</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="explorer-chrome.css"><link rel="stylesheet" href="fixes.css"><link rel="stylesheet" href="polish.css"><link rel="stylesheet" href="settings.css"><link rel="stylesheet" href="explorer-workflows.css"></head><body>

<div id="tabs" class="tabs"></div>
<div class="navigation"><div class="nav-buttons"><button data-action="back" title="Back (Alt+Left)" aria-label="Back">←</button><button data-action="forward" title="Forward (Alt+Right)" aria-label="Forward">→</button><button data-action="up" title="Up (Alt+Up)" aria-label="Up">↑</button><button data-action="refresh" title="Refresh (F5)" aria-label="Refresh">↻</button></div><form id="address-form"><span id="address-icon"></span><nav id="breadcrumbs" aria-label="Breadcrumb"></nav><input id="address" aria-label="Folder address" spellcheck="false"></form><label class="search"><span id="search-icon"></span><input id="search" placeholder="Search this folder" aria-label="Search this folder"><button id="clear-search" type="button" title="Clear search" aria-label="Clear search" hidden>×</button></label></div>
<div class="toolbar explorer-commands" aria-label="File commands">
<button data-action="mkdir" id="new-button" title="New folder (Ctrl+Shift+N)"><span class="command-icon" data-symbol="new"></span><span>New</span></button><span class="separator"></span>
<button class="icon-command" data-action="cut" title="Cut (Ctrl+X)" aria-label="Cut"></button>
<button class="icon-command" data-action="copy" title="Copy (Ctrl+C)" aria-label="Copy"></button>
<button class="icon-command" data-action="paste" title="Paste (Ctrl+V)" aria-label="Paste"></button>
<button class="icon-command" data-action="rename" title="Rename (F2)" aria-label="Rename"></button>
<button class="icon-command" data-action="trash" title="Move to Recycle Bin (Delete)" aria-label="Move to Recycle Bin"></button><span class="separator"></span>
<input id="sort" type="hidden" value="name"><details class="command-menu" id="sort-menu"><summary><span class="command-icon" data-symbol="sort"></span>Sort</summary><div class="command-popover" role="menu" aria-label="Sort files"><button data-sort="name" role="menuitemradio" aria-checked="true">Name</button><button data-sort="modified" role="menuitemradio" aria-checked="false">Date modified</button><button data-sort="size" role="menuitemradio" aria-checked="false">Size</button><button data-sort="extension" role="menuitemradio" aria-checked="false">Type</button></div></details>
<details class="command-menu"><summary><span class="command-icon" data-symbol="view"></span>View</summary><div class="command-popover view-switch"><button data-action="list-view" class="active">Details</button><button data-action="grid-view">Grid</button></div></details>
<details class="command-menu"><summary aria-label="More options" title="More options">···</summary><div class="command-popover"><button data-action="hidden" id="hidden-button" title="Show Windows hidden and system items">Show hidden items</button><button data-action="choose">Open folder…</button></div></details>
<span class="toolbar-spacer"></span><button class="details-command" data-action="preview-toggle" id="preview-toggle"><span class="command-icon" data-symbol="details"></span>Details</button></div>
<div class="workspace"><aside class="sidebar"><div class="section-label">QUICK ACCESS</div><nav id="locations"></nav><div class="section-label storage-label">THIS PC <button data-action="choose" title="Open folder">+</button></div><nav id="drives"></nav><div class="sidebar-bottom"><div class="sidebar-rule"></div><button data-action="theme" id="theme-button">◐ <span>Appearance</span><small id="theme-label">Dark</small></button><span class="local-label"><i></i> Local files · on your device</span></div></aside>
<main><div class="folder-heading" hidden><div><div class="eyebrow" id="folder-parent">YOUR WORKSPACE</div><h1 id="folder-name">Home</h1></div></div><div id="notice" role="status" aria-live="polite"></div><div class="content"><section id="file-area" aria-label="Files"><div class="columns"><span>Name</span><span>Date modified</span><span>Type</span><span>Size</span></div><div id="files" role="listbox" aria-label="Folder contents" aria-multiselectable="true" tabindex="0"></div></section><aside id="details"><div class="details-heading">FILE DETAILS <button data-action="preview-toggle" aria-label="Close details">×</button></div><div id="preview-content" class="preview-content"></div></aside></div><footer><span id="count">Loading…</span><span id="selection-count"></span><span class="footer-right" id="footer-path"></span></footer></main></div>
<dialog id="name-dialog"><form id="name-form"><div class="eyebrow">NOTHING EXPLORER</div><h2 id="dialog-title">New folder</h2><label for="item-name">Name</label><input id="item-name" autocomplete="off" required><p id="dialog-error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel-dialog">Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog><dialog id="properties-dialog"><form method="dialog"><button aria-label="Close properties">Close</button></form><div id="properties-content"></div></dialog><dialog id="archive-dialog"><div class="archive-heading"><h2 id="archive-title">Archive</h2><button id="archive-close" aria-label="Close archive">×</button></div><p id="archive-summary"></p><div id="archive-list"></div><div class="dialog-actions"><button id="archive-extract" class="primary">Extract all…</button></div></dialog><aside id="transfer-panel" hidden><strong>File operations</strong><div id="transfer-jobs"></div></aside><script src="frame-clock.js"></script><script src="query.js"></script><script src="renderer.js"></script><script src="drop-intent.js"></script><script src="archive-formats.js"></script><script src="capabilities.js"></script><script src="file-layout.js"></script><script src="file-list.js"></script><script src="presentation.js"></script><script src="interactions.js"></script><script src="settings.js"></script><script src="shell-tools.js"></script><script src="bulk-rename.js"></script><script src="parity.js"></script><script src="native-shell.js"></script><script src="explorer-workflows.js"></script></body></html>
