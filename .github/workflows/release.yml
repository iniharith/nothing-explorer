name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify tag matches package
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ.' }
      - run: npm test
      - name: Build installer and update metadata
        run: npm run installer -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Packaged smoke
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $app = Start-Process -FilePath '.\release\win-unpacked\Nothing Explorer.exe' -ArgumentList '--smoke','--capture','--interaction-test','--window-test' -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput artifacts/ci-smoke.log -RedirectStandardError artifacts/ci-smoke-error.log
          Get-Content artifacts/ci-smoke.log
          Get-Content artifacts/ci-smoke-error.log
          if ($app.ExitCode -ne 0) { throw "Smoke exited $($app.ExitCode)" }
      - name: Publish validated stable release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME --title "Nothing Explorer $env:GITHUB_REF_NAME" --generate-notes --draft
          gh release upload $env:GITHUB_REF_NAME 'release/*.exe' 'release/*.blockmap' 'release/latest.yml' --clobber
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            artifacts/**
